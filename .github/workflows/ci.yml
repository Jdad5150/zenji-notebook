name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install
        working-directory: src/frontend

      - name: Lint Frontend
        run: bun run lint
        working-directory: src/frontend

      - name: Check Frontend
        run: bun run check
        working-directory: src/frontend

      - name: Build Frontend
        run: bun run build
        working-directory: src/frontend

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python3.14-dev

      - name: Build Backend
        run: zig build

      - name: Test
        run: zig build test
